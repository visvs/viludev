version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Grouped so a quiet week is one review, not fifteen.
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns:
          [
            'eslint*',
            '@typescript-eslint/*',
            'typescript-eslint',
            'prettier*',
            'vitest',
            '@vitest/*',
          ]
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
