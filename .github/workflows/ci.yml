name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; the newest commit is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser is needed twice: by Vitest's browser project, and by the
      # accessibility audit. `--with-deps` installs the system libraries the
      # GitHub runner does not ship.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Accessibility and critical-path JavaScript budget, against the real
      # build output. This is the gate that has actually caught regressions.
      - name: Audit
        run: pnpm audit:a11y
